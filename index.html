<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>隐印</title>
<style>
/* 单列手机优先：印章式标识 + 两个工作面板（加印 / 验印），像一枚随身的私章 */
:root {
  --paper: #f3f4f7;
  --card: #ffffff;
  --ink: #1c2130;
  --muted: #6a7082;
  --line: #dde0e7;
  --seal: #b3243a;
  --seal-soft: #f7e6e9;
  --ok: #1d7a55;
  --ok-soft: #e3f3ec;
  --bad: #9a5b00;
  --bad-soft: #fbf0dc;
  --f-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-seal: "STKaiti", "Kaiti SC", "KaiTi", "BiauKai", serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13151b; --card: #1c1f28; --ink: #e7e9ef; --muted: #9398a8; --line: #2e3240;
    --seal: #e8566c; --seal-soft: #3a1c23; --ok: #4cc493; --ok-soft: #15302a; --bad: #e0a54a; --bad-soft: #33280f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13151b; --card: #1c1f28; --ink: #e7e9ef; --muted: #9398a8; --line: #2e3240;
  --seal: #e8566c; --seal-soft: #3a1c23; --ok: #4cc493; --ok-soft: #15302a; --bad: #e0a54a; --bad-soft: #33280f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); margin: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 14px; }
.seal { width: 56px; height: 56px; flex: none; background: var(--seal); color: #fff; border-radius: 6px;
  display: grid; grid-template-columns: 1fr 1fr; place-items: center; font: 22px/1 var(--f-seal);
  box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 4.5px rgba(255,255,255,.75); padding: 6px; }
.seal span { writing-mode: vertical-rl; }
h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 9px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); }
label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input[type=text], input[type=password], textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
input:focus-visible, button:focus-visible, textarea:focus-visible, .pick:focus-within { outline: 2px solid var(--seal); outline-offset: 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.check { flex-direction: row; align-items: center; gap: 6px; }
.pick { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); cursor: pointer; text-align: center; }
.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px; background: var(--seal); color: #fff; cursor: pointer; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; padding: 8px 12px; }
.result img { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px; }
.status { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status.info { background: var(--seal-soft); color: var(--seal); }
.status b { color: inherit; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; margin-top: 6px; color: var(--ink); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
details summary { cursor: pointer; font-weight: 600; }
details > div { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.scroll { overflow-x: auto; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; }
@keyframes r { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="seal" aria-hidden="true"><span>隐</span><span>印</span></div>
    <div>
      <h1>隐印</h1>
      <p class="sub">给 OC 图盖一枚看不见的章。图片只在这台手机上处理，不上传。</p>
    </div>
  </header>

  <section class="card">
    <label>私章口令（加印和验印要用同一个，<b>丢了就验不出来，写在备忘录里</b>）
      <input id="pw" type="password" autocomplete="off" placeholder="比如：月泠塞勒涅娅1221">
    </label>
    <label class="check"><input id="remember" type="checkbox" checked> 在这台手机上记住口令</label>
  </section>

  <div class="tabs" role="tablist">
    <button id="tab-embed" role="tab" aria-selected="true">加印</button>
    <button id="tab-check" role="tab" aria-selected="false">验印</button>
  </div>

  <section id="panel-embed" class="card">
    <label class="pick" id="pick-embed"><input id="file-embed" type="file" accept="image/*"><span id="pick-embed-text">选一张原图（建议 PNG / 原画质）</span></label>
    <label>这份发给谁 / 发到哪（可不填，泄露后能查出是哪一份）
      <input id="to" type="text" placeholder="比如：小红书主页 / 画师A / 约稿群">
    </label>
    <button id="go-embed" class="btn" disabled>盖章</button>
    <div id="embed-out" class="result" hidden></div>
  </section>

  <section id="panel-check" class="card" hidden>
    <label class="pick" id="pick-check"><input id="file-check" type="file" accept="image/*"><span id="pick-check-text">选一张可疑图（截图、保存下来的都行）</span></label>
    <button id="go-check" class="btn" disabled>验章</button>
    <div id="check-out" hidden></div>
    <p class="hint">能扛住：压缩、缩放、调亮度、存了又发。扛不住：裁掉一部分、截图带了边框、镜像旋转、重绘涂改。遇到截图，先在相册里把多余边框裁掉，尽量只留原图部分再验。</p>
  </section>

  <section class="card">
    <details>
      <summary>盖章记录 <span id="log-count" class="hint"></span></summary>
      <div>
        <div class="scroll"><table><thead><tr><th>编号</th><th>日期</th><th>发给</th><th>文件</th></tr></thead><tbody id="log-body"></tbody></table></div>
        <p class="hint">记录只存在这台手机的浏览器里，清缓存会没。记录丢了也能验出是你的章和盖章日期，只是看不到“发给谁”。换手机前先复制备份。</p>
        <div class="row">
          <button id="log-copy" class="btn ghost">复制备份</button>
          <button id="log-import-btn" class="btn ghost">导入备份</button>
        </div>
        <textarea id="log-import" rows="3" placeholder="把备份粘贴到这里，再点一次导入" hidden></textarea>
      </div>
    </details>
  </section>
</div>

<script>
"use strict";
// ================= 水印核心 =================
// 思路：把图的亮度缩到长边 512 的"标准尺寸"，在 8×8 块的 DCT 低频系数上做 QIM 量化嵌入，
// 再把改动放大回原图。因为坐标系跟着图的比例走，图被缩放、压缩后缩回标准尺寸还能读出来。
const CANON = 256, B = 8, DELTA = 34, NBITS = 64;
const POS = [[0, 1], [1, 0], [1, 1], [0, 2], [2, 0]];
const MIN_STD = 0;

const DCTM = (() => {
  const m = new Float64Array(64);
  for (let k = 0; k < 8; k++) for (let n = 0; n < 8; n++)
    m[k * 8 + n] = (k ? Math.sqrt(2 / 8) : Math.sqrt(1 / 8)) * Math.cos(Math.PI * (2 * n + 1) * k / 16);
  return m;
})();
// basis[p] = 系数 POS[p] 对应的 8×8 空间基
const BASIS = POS.map(([u, v]) => { const b = new Float64Array(64); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) b[y * 8 + x] = DCTM[u * 8 + y] * DCTM[v * 8 + x]; return b; });

function canonSize(w, h) {
  return w >= h ? [CANON, Math.max(8, Math.round(CANON * h / w))] : [Math.max(8, Math.round(CANON * w / h)), CANON];
}

// 一维重采样权重：缩小用面积平均，放大用双线性
function weights(sn, dn) {
  const out = [], s = sn / dn;
  for (let i = 0; i < dn; i++) {
    const w = [];
    if (s >= 1) {
      const a = i * s, b = (i + 1) * s;
      for (let j = Math.floor(a); j < Math.ceil(b); j++) {
        const ov = Math.min(b, j + 1) - Math.max(a, j);
        if (ov > 0) w.push(Math.min(j, sn - 1), ov / s);
      }
    } else {
      let x = (i + 0.5) * s - 0.5; x = Math.max(0, Math.min(sn - 1, x));
      const j = Math.floor(x), f = x - j;
      w.push(j, 1 - f); if (j + 1 < sn) w.push(j + 1, f);
    }
    out.push(w);
  }
  return out;
}
function resample(src, sw, sh, dw, dh) {
  const wx = weights(sw, dw), wy = weights(sh, dh);
  const tmp = new Float32Array(dw * sh);
  for (let y = 0; y < sh; y++) { const r = y * sw, o = y * dw;
    for (let x = 0; x < dw; x++) { const w = wx[x]; let s = 0; for (let k = 0; k < w.length; k += 2) s += src[r + w[k]] * w[k + 1]; tmp[o + x] = s; } }
  const out = new Float32Array(dw * dh);
  for (let y = 0; y < dh; y++) { const w = wy[y], o = y * dw;
    for (let x = 0; x < dw; x++) { let s = 0; for (let k = 0; k < w.length; k += 2) s += tmp[w[k] * dw + x] * w[k + 1]; out[o + x] = s; } }
  return out;
}
function luma(px, n) {
  const y = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) y[i] = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];
  return y;
}
function alphaOf(px, n) { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = px[i * 4 + 3]; return a; }

// 自带 SHA-256：直接打开本地 HTML 或在 App 内置浏览器里时 crypto.subtle 不一定可用
function sha256(bytes) {
  const K = [], H = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (p) { if (c < 8) H[c] = Math.pow(n, 1 / 2) * 4294967296 | 0; K[c++] = Math.pow(n, 1 / 3) * 4294967296 | 0; }
  }
  const l = bytes.length, m = new Uint8Array((l + 72 >> 6) << 6); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(m.length - 4, l * 8);
  const w = new Int32Array(64), rot = (x, k) => x >>> k | x << 32 - k;
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (rot(a, 7) ^ rot(a, 18) ^ a >>> 3) + w[i - 7] + (rot(b, 17) ^ rot(b, 19) ^ b >>> 10) + w[i - 16] | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + (e & f ^ ~e & g) + K[i] + w[i] | 0;
      const t2 = (rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + (a & b ^ a & c ^ b & c) | 0;
      h = g; g = f; f = e; e = d + t1 | 0; d = c; c = b; b = a; a = t1 + t2 | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => H[i] = H[i] + v | 0);
  }
  return H.map(v => v >>> 0);
}
async function keyRng(pw) {
  let [a, b, c, d] = sha256(new TextEncoder().encode("yinyin-v1|" + pw));
  return () => { // xoshiro128**
    const r = Math.imul(Math.imul(b, 5) << 7 | Math.imul(b, 5) >>> 25, 9) >>> 0;
    const t = b << 9; c ^= a; d ^= b; b ^= c; a ^= d; c ^= t; d = d << 11 | d >>> 21;
    return r / 4294967296;
  };
}
// 每个"槽"=某块的某个系数；用口令打乱后分给 64 个比特，每个槽有自己的抖动
async function layout(pw, cw, ch) {
  const rng = await keyRng(pw);
  const bx = Math.floor(cw / B), by = Math.floor(ch / B), n = bx * by * POS.length;
  const perm = new Uint32Array(n); for (let i = 0; i < n; i++) perm[i] = i;
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  const bit = new Uint8Array(n), dither = new Float32Array(n);
  for (let i = 0; i < n; i++) { bit[i] = perm[i] % NBITS; dither[i] = rng() * DELTA; }
  return { bx, by, bit, dither };
}
function blockStats(Y, cw, bx0, by0) {
  let s = 0, s2 = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const v = Y[(by0 * 8 + y) * cw + bx0 * 8 + x]; s += v; s2 += v * v; }
  const m = s / 64; return [m, Math.sqrt(Math.max(0, s2 / 64 - m * m))];
}
function coef(Y, cw, bx0, by0, p) {
  const b = BASIS[p]; let s = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) s += Y[(by0 * 8 + y) * cw + bx0 * 8 + x] * b[y * 8 + x];
  return s;
}
function usable(Y, A, cw, bx0, by0) {
  const [m, sd] = blockStats(Y, cw, bx0, by0);
  if (sd < MIN_STD || m < 6 || m > 249) return false;
  if (A) for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (A[(by0 * 8 + y) * cw + bx0 * 8 + x] < 250) return false;
  return true;
}

async function embed(img, pw, bits) {
  const { width: w, height: h, data: px } = img, n = w * h;
  const [cw, ch] = canonSize(w, h);
  const L = await layout(pw, cw, ch);
  const Y0 = resample(luma(px, n), w, h, cw, ch), A0 = resample(alphaOf(px, n), w, h, cw, ch);
  const slots = [];
  for (let by0 = 0; by0 < L.by; by0++) for (let bx0 = 0; bx0 < L.bx; bx0++) {
    if (!usable(Y0, A0, cw, bx0, by0)) continue;
    for (let p = 0; p < POS.length; p++) {
      const s = (by0 * L.bx + bx0) * POS.length + p, c = coef(Y0, cw, bx0, by0, p);
      const off = L.dither[s] + bits[L.bit[s]] * DELTA / 2;
      slots.push([bx0, by0, p, Math.round((c - off) / DELTA) * DELTA + off]);
    }
  }
  if (slots.length < NBITS * 6) throw new Error("这张图可用的细节太少（大片纯色/透明），盖不上章。换一张内容更丰富的图。");
  const out = new Uint8ClampedArray(px);
  const D = new Float32Array(cw * ch);
  let Yc = Y0;
  for (let pass = 0; pass < 4; pass++) {
    for (const [bx0, by0, p, t] of slots) {
      const e = t - coef(Yc, cw, bx0, by0, p), b = BASIS[p];
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) D[(by0 * 8 + y) * cw + bx0 * 8 + x] += e * b[y * 8 + x];
    }
    const up = resample(D, cw, ch, w, h);
    for (let i = 0, j = 0; i < n; i++, j += 4) { const d = up[i]; out[j] = px[j] + d; out[j + 1] = px[j + 1] + d; out[j + 2] = px[j + 2] + d; }
    Yc = resample(luma(out, n), w, h, cw, ch);
  }
  let se = 0; for (let i = 0; i < n * 4; i++) if ((i & 3) !== 3) { const d = out[i] - px[i]; se += d * d; }
  const psnr = 10 * Math.log10(255 * 255 / Math.max(1e-9, se / (n * 3)));
  return { data: out, psnr, slots: slots.length };
}

async function extract(img, pw) {
  const { width: w, height: h, data: px } = img, n = w * h;
  const [cw, ch] = canonSize(w, h);
  const L = await layout(pw, cw, ch);
  const Y = resample(luma(px, n), w, h, cw, ch), A = resample(alphaOf(px, n), w, h, cw, ch);
  const sum = new Float64Array(NBITS), cnt = new Uint32Array(NBITS);
  for (let by0 = 0; by0 < L.by; by0++) for (let bx0 = 0; bx0 < L.bx; bx0++) {
    if (!usable(Y, A, cw, bx0, by0)) continue;
    for (let p = 0; p < POS.length; p++) {
      const s = (by0 * L.bx + bx0) * POS.length + p;
      sum[L.bit[s]] += Math.cos(2 * Math.PI * (coef(Y, cw, bx0, by0, p) - L.dither[s]) / DELTA);
      cnt[L.bit[s]]++;
    }
  }
  const bits = Array.from(sum, v => v < 0 ? 1 : 0);
  let conf = 0; for (let i = 0; i < NBITS; i++) conf += cnt[i] ? Math.abs(sum[i]) / cnt[i] : 0;
  return { payload: parsePayload(bits), confidence: conf / NBITS };
}

// 载荷 8 字节：'Y''Y' + 盖章日(自 2024-01-01 的天数) + 随机数 + 校验
const EPOCH = Date.UTC(2024, 0, 1);
function crc16(bytes) { let c = ~0; for (const b of bytes) { c ^= b; for (let k = 0; k < 8; k++) c = c >>> 1 ^ (0xEDB88320 & -(c & 1)); } return (~c >>> 0) & 0xFFFF; }
function makePayload(day, rnd) {
  const b = [0x59, 0x59, day >> 8 & 255, day & 255, rnd >> 8 & 255, rnd & 255]; const c = crc16(b); b.push(c >> 8, c & 255);
  return b.flatMap(x => [7, 6, 5, 4, 3, 2, 1, 0].map(k => x >> k & 1));
}
function parsePayload(bits) {
  const b = []; for (let i = 0; i < 8; i++) { let v = 0; for (let k = 0; k < 8; k++) v = v << 1 | bits[i * 8 + k]; b.push(v); }
  if (b[0] !== 0x59 || b[1] !== 0x59 || crc16(b.slice(0, 6)) !== (b[6] << 8 | b[7])) return null;
  const day = b[2] << 8 | b[3], rnd = b[4] << 8 | b[5];
  return { day, rnd, id: ((day << 16 | rnd) >>> 0).toString(16).padStart(8, "0"), date: new Date(EPOCH + day * 864e5).toISOString().slice(0, 10) };
}

// ================= 图片读写 =================
const MAX_PX = 16e6;
async function loadImage(src) {
  const url = src instanceof Blob ? URL.createObjectURL(src) : src;
  const el = new Image(); el.decoding = "async"; el.src = url;
  await el.decode();
  let w = el.naturalWidth, h = el.naturalHeight, scaled = false;
  if (w * h > MAX_PX) { const k = Math.sqrt(MAX_PX / (w * h)); w = Math.floor(w * k); h = Math.floor(h * k); scaled = true; }
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(el, 0, 0, w, h);
  if (src instanceof Blob) URL.revokeObjectURL(url);
  return { img: ctx.getImageData(0, 0, w, h), scaled };
}
function toCanvas(img) { const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height; cv.getContext("2d").putImageData(img, 0, 0); return cv; }
const toBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));
// 自检：缩到 60% 再按 JPEG 60 压一遍，模拟被转发
async function selfTest(img, pw) {
  const cv = toCanvas(img), s = document.createElement("canvas");
  s.width = Math.round(img.width * 0.6); s.height = Math.round(img.height * 0.6);
  const sx = s.getContext("2d"); sx.fillStyle = "#fff"; sx.fillRect(0, 0, s.width, s.height); sx.drawImage(cv, 0, 0, s.width, s.height);
  const { img: back } = await loadImage(await toBlob(s, "image/jpeg", 0.6));
  return (await extract(back, pw)).payload;
}

// ================= 页面 =================
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("pw").value = store.get("yy.pw", "");
$("remember").checked = store.get("yy.remember", true);
function savePw() { store.set("yy.remember", $("remember").checked); $("remember").checked ? store.set("yy.pw", $("pw").value) : store.del("yy.pw"); }
$("pw").addEventListener("input", () => { savePw(); refresh(); });
$("remember").addEventListener("change", savePw);

for (const [t, p, o] of [["tab-embed", "panel-embed", "tab-check"], ["tab-check", "panel-check", "tab-embed"]])
  $(t).addEventListener("click", () => { $(t).setAttribute("aria-selected", "true"); $(o).setAttribute("aria-selected", "false"); $(p).hidden = false; $(p === "panel-embed" ? "panel-check" : "panel-embed").hidden = true; });

// 在 Claude 里打开时走平台下载；直接打开 HTML 文件时 window.claude 不存在，退回普通下载链接
let downloads = null;
window.claude?.use?.("downloads").then(d => { downloads = d; }).catch(() => {});

const files = { embed: null, check: null };
for (const k of ["embed", "check"]) $("file-" + k).addEventListener("change", e => {
  files[k] = e.target.files[0] || null;
  $("pick-" + k + "-text").textContent = files[k] ? "已选：" + files[k].name : $("pick-" + k + "-text").dataset.empty;
  refresh();
});
$("pick-embed-text").dataset.empty = $("pick-embed-text").textContent;
$("pick-check-text").dataset.empty = $("pick-check-text").textContent;
function refresh() { const pw = $("pw").value.length > 0; $("go-embed").disabled = !(pw && files.embed); $("go-check").disabled = !(pw && files.check); }

function busy(btn, on, label) { btn.disabled = on; btn.innerHTML = on ? '<span class="spin"></span> ' + label : btn.dataset.label; }
$("go-embed").dataset.label = "盖章"; $("go-check").dataset.label = "验章";
const tick = () => new Promise(r => setTimeout(r, 30));

let lastUrl = null;
$("go-embed").addEventListener("click", async () => {
  const btn = $("go-embed"), out = $("embed-out"), pw = $("pw").value;
  busy(btn, true, "盖章中…"); await tick();
  try {
    const { img, scaled } = await loadImage(files.embed);
    if (Math.max(img.width, img.height) < 512) throw new Error("图太小了（长边不到 512 像素），换张清晰点的原图。");
    const day = Math.floor((Date.now() - EPOCH) / 864e5), rnd = Math.floor(Math.random() * 65536);
    const r = await embed(img, pw, makePayload(day, rnd));
    const marked = new ImageData(r.data, img.width, img.height);
    const ok = await selfTest(marked, pw);
    const blob = await toBlob(toCanvas(marked), "image/png");
    const info = parsePayload(makePayload(day, rnd));
    const name = files.embed.name.replace(/\.[^.]+$/, "") + "_隐印.png";
    const log = store.get("yy.log", []); log.unshift({ id: info.id, date: info.date, to: $("to").value.trim(), file: files.embed.name }); store.set("yy.log", log); renderLog();
    if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = URL.createObjectURL(blob);
    out.hidden = false;
    out.innerHTML = `
      <div class="status ${ok ? "ok" : "bad"}"><b>${ok ? "盖好了" : "盖上了，但抗压缩自检没过"}</b>
        ${ok ? "模拟缩小 + 压缩转发后仍能验出。" : "这张图细节偏少，被压缩后可能验不出来。可以换原画质更高的版本再试。"}
        <dl class="kv"><dt>编号</dt><dd class="mono">${info.id}</dd><dt>发给</dt><dd>${esc($("to").value.trim() || "未填")}</dd>
        <dt>画质</dt><dd>PSNR ${r.psnr.toFixed(1)} dB ${r.psnr > 36 ? "（肉眼基本看不出）" : "（放大看平涂区域可能有极淡纹理）"}</dd>
        ${scaled ? "<dt>注意</dt><dd>原图太大，已缩到 1600 万像素以内</dd>" : ""}</dl></div>
      <img src="${lastUrl}" alt="已盖章的图">
      <p class="hint"><b>长按上面的图 → 保存到相册</b>，发出去的一律用这张。原图自己留着别发。</p>
      <div class="row"><button class="btn ghost" id="save-img">保存 PNG</button>
        <button class="btn ghost" id="copy-img">复制图片</button></div>`;
    $("save-img").addEventListener("click", async e => {
      if (!downloads) { const a = document.createElement("a"); a.href = lastUrl; a.download = name; a.click(); return; }
      try { await downloads.save({ filename: name, data: blob }); e.target.textContent = "已保存"; }
      catch (err) { e.target.textContent = err && err.code === "declined" ? "保存 PNG" : "保存不了，请长按图片保存"; }
    });
    $("copy-img").addEventListener("click", async e => {
      try { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); e.target.textContent = "已复制"; }
      catch { e.target.textContent = "复制不了，请长按图片保存"; }
    });
  } catch (e) {
    out.hidden = false; out.innerHTML = `<div class="status bad">${esc(e.message || e)}</div>`;
  }
  busy(btn, false); refresh();
});

$("go-check").addEventListener("click", async () => {
  const btn = $("go-check"), out = $("check-out"), pw = $("pw").value;
  busy(btn, true, "验章中…"); await tick();
  try {
    const { img } = await loadImage(files.check);
    const r = await extract(img, pw);
    out.hidden = false;
    if (r.payload) {
      const hit = store.get("yy.log", []).find(x => x.id === r.payload.id);
      out.innerHTML = `<div class="status ok"><b>验到了，这是用你的口令盖过章的图。</b>
        <dl class="kv"><dt>编号</dt><dd class="mono">${r.payload.id}</dd><dt>盖章日期</dt><dd>${r.payload.date}</dd>
        <dt>发给</dt><dd>${hit ? esc(hit.to || "未填") : "本机没有这条记录"}</dd>${hit ? `<dt>原文件</dt><dd>${esc(hit.file)}</dd>` : ""}
        <dt>信号强度</dt><dd>${Math.round(r.confidence * 100)}%</dd></dl></div>`;
    } else {
      out.innerHTML = `<div class="status bad"><b>没验到章。</b>可能是：这张图没盖过章、口令不对、图被裁剪/加了边框，或者压得太狠。截图的话先把边框裁干净再试。</div>`;
    }
  } catch (e) {
    out.hidden = false; out.innerHTML = `<div class="status bad">${esc(e.message || e)}</div>`;
  }
  busy(btn, false); refresh();
});

function renderLog() {
  const log = store.get("yy.log", []);
  $("log-count").textContent = log.length ? `（${log.length} 条）` : "（还没有）";
  $("log-body").innerHTML = log.length ? log.map(x => `<tr><td class="mono">${x.id}</td><td>${x.date}</td><td>${esc(x.to || "—")}</td><td>${esc(x.file)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="hint">盖过章的图会记在这里：编号、日期、发给谁。</td></tr>`;
}
renderLog();
$("log-copy").addEventListener("click", async e => {
  const text = JSON.stringify(store.get("yy.log", []));
  try { await navigator.clipboard.writeText(text); e.target.textContent = "已复制，存到备忘录里"; }
  catch { const t = $("log-import"); t.hidden = false; t.value = text; t.select(); e.target.textContent = "复制不了，已选中下面的文字，手动复制"; }
});
$("log-import-btn").addEventListener("click", () => {
  const t = $("log-import");
  if (t.hidden || !t.value.trim()) { t.hidden = false; t.value = ""; t.focus(); return; }
  try {
    const add = JSON.parse(t.value); if (!Array.isArray(add)) throw 0;
    const log = store.get("yy.log", []), ids = new Set(log.map(x => x.id));
    for (const x of add) if (x && x.id && !ids.has(x.id)) log.push(x);
    store.set("yy.log", log); renderLog(); t.value = ""; t.hidden = true;
  } catch { t.value = ""; t.placeholder = "格式不对，粘贴“复制备份”得到的那段文字"; }
});

window.YY = { layout, resample, luma, alphaOf, coef, usable, canonSize, sha256, embed, extract, makePayload, parsePayload, loadImage, toCanvas, toBlob, selfTest };
refresh();
</script>
